<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Learning Annotator</title>
  <link rel="stylesheet" href="/annotator.css">
  <script src="/annotator.js" defer></script>
</head>
<body>
  <main>
    <h1>离线轨迹标注</h1>
    <p>仅供本机合成或已授权 Episode 使用；不连接机械臂。未知编码的图像不会预览。</p>
    <label for="episode">Episode</label>
    <select id="episode"></select>
    <p id="summary"></p>
    <div id="frame-controls">
      <label for="frame-index">图像帧索引</label>
      <input id="frame-index" type="number" min="0" step="1" value="0">
      <img id="frame-preview" alt="当前图像帧预览">
      <p id="frame-status" role="status"></p>
    </div>
    <label for="annotator">标注人</label>
    <input id="annotator" type="text" required autocomplete="name">
    <h2>片段</h2>
    <p>帧索引采用半开区间 [开始, 结束)。</p>
    <table>
      <thead><tr><th>开始</th><th>结束</th><th>说明</th><th>用于 VLM</th><th></th></tr></thead>
      <tbody id="spans"></tbody>
    </table>
    <div class="actions">
      <button id="add-span" type="button">添加片段</button>
      <button id="save" type="button">保存标注</button>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
