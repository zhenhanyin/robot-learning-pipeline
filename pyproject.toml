[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learning-pipeline"
version = "0.0.7"
description = "Robot data collection, annotation, training, and deployment interfaces"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.scripts]
robot-learning = "robot_learning.cli:main"

[project.urls]
Repository = "https://github.com/zhenhanyin/robot-learning-pipeline"
Issues = "https://github.com/zhenhanyin/robot-learning-pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_learning*"]

[tool.setuptools.package-data]
"robot_learning.apps" = ["annotator.html", "annotator.js", "annotator.css"]
