name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[hdf5,vlm]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/collect_synthetic.py ./data/ci-demo
      - run: robot-learning inspect ./data/ci-demo
      - run: robot-learning export ./data/ci-demo ./data/ci-demo.hdf5 --format hdf5
      - run: robot-learning annotate-span ./data/ci-demo --annotator ci --start 0 --end 4 --text 'pick object' --used-for-vlm
      - run: robot-learning build-vlm ./data/ci-demo ./data/ci-vlm --camera base --instruction 'What is happening?'
      - run: python examples/collect_piper_synthetic.py ./data/ci-piper
      - run: robot-learning validate ./data/ci-piper
      - run: python examples/collect_arx_synthetic.py ./data/ci-arx
      - run: robot-learning validate ./data/ci-arx
      - run: robot-learning preview-arx ./data/ci-arx
      - run: python examples/preview_policy_synthetic.py --model act
      - run: python examples/preview_policy_synthetic.py --model hrdt
      - run: python examples/preview_policy_synthetic.py --model pi0
      - run: python examples/preview_policy_synthetic.py --model pi0.5
      - run: python examples/task_synthetic.py
      - run: robot-learning task-demo --help
